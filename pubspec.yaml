name: planstar
description: "企划星 PlanStar: a Flutter desktop agent workbench — chat UI, tool-call projection via Genkit, and a split-pane workbench."
version: 0.1.0
license: GPL-3.0-or-later
# An app, never published — declared so the board_panel path dependency is
# legitimate (a publishable package may not carry one).
publish_to: 'none'

environment:
  sdk: ^3.11.5
  flutter: ">=1.17.0"

dependencies:
  archive: ^3.6.1
  # ADR-0007: the board/calendar/table panels. Vendored in-repo (no upstream to
  # re-fetch — see the ADR for why this is a recorded exception to the ADR-0001
  # "vendored packages stay out of the repo" rule).
  board_panel:
    path: packages/appunits/board_panel
  plan_editor:
    path: packages/appunits/plan_editor
  # ADR-0084 D4 Tier A: host-agnostic app capabilities — user feedback form +
  # in-app upgrade panel (self-drawn shadcn UI driven by an engine-agnostic
  # UpgradeController contract). Consumed downward by lib; never imports lib.
  app_common:
    path: packages/appunits/app_common
  # ADR-0083 依赖路线（sentry → stone_core → pudding → appunits → lib）：lib 直接
  # 消费 stone_core 基础设施层（lib/ui/auth 的 Google 登录服务经 StoneLogger 打日志）。
  stone_core:
    path: packages/infras/stone_core
  # Editor link chips open the system browser (ADR-0044 P10-d); already in
  # the tree as pdfrx's transitive dependency, promoted so lib may import it.
  url_launcher: ^6.3.2
  # OS keychain for the API key (ADR-0045 PB): macOS Keychain, Windows DPAPI,
  # Linux libsecret. Tests inject the in-memory implementation.
  collection: ^1.19.0
  flutter_secure_storage: ^9.2.2
  # The auth polling transport (ADR-0045 PE); already in the tree via genkit,
  # promoted so lib/state may import it.
  http: ^1.2.0
  # ── BetterAuth 客户端 + Google 登录（lib/ui/auth，对接 agent_harness_server）──
  # 后端 better-auth 挂载点：http://localhost:8000/api/auth（根 `.env` 的 BETTER_AUTH_URL）。
  # dotenv 从打包的 `.env` 资源读 base URL 与 Google OAuth client id。
  flutter_dotenv: ^5.2.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.0
  desktop_drop: ^0.8.4
  file_picker: ^10.3.7
  flutter:
    sdk: flutter
  # i18n: framework localizations + the gen-l10n runtime. intl's version is
  # pinned by flutter_localizations, so `any` is the documented form.
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_inappwebview: ^6.1.5
  flutter_lucide: ^1.33.0
  flutter_mermaid: ^0.1.0
  flutter_pty: ^0.4.2
  flutter_riverpod: 3.2.1
  riverpod_annotation: 4.0.2
  # The genkit family.
  genkit: ^0.16.1
  genkit_anthropic: ^0.3.1
  genkit_google_genai: ^0.3.1
  genkit_mcp: ^0.3.1
  genkit_middleware: ^0.6.1
  genkit_openai: ^0.4.1
  # The gpt_markdown package.
  gpt_markdown: ^1.2.1
  hotkey_manager: ^0.2.3
  pasteboard: ^0.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfrx: ^1.3.5
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  schemantic: ^0.2.2
  shadcn_ui: 0.56.3
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  xterm: ^4.0.0
  drift: ^2.31.0
  # Drift loads the system sqlite3 on all three desktop targets
  # (sqlite3 ^2.9 falls back to /usr/lib/libsqlite3.dylib,
  # libsqlite3.so, sqlite3.dll / winsqlite3.dll) — no bundled
  # native library needed (ADR-0085 D2).
  screen_retriever: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.15.1
  drift_dev: ^2.31.0
  path_provider_platform_interface: ^2.1.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The framework's own widgets reach for MaterialIcons (PopupMenuButton's
  # default chevron, selection handles); app code uses Lucide via
  # flutter_lucide.
  uses-material-design: true

  # Regenerate lib/l10n/app_localizations*.dart from the .arb files on
  # `flutter pub get` / build.
  generate: true

  assets:
    - assets/icon/app_icon_source.png
    # Desktop has no native launch-screen slot (unlike iOS's LaunchScreen.storyboard),
    # so the brand splash ships as an asset for app code to paint on the first frame.
    - assets/branding/
    # flutter_dotenv 运行时读取的后端连接配置（BETTER_AUTH_URL / Google client id）。
    - .env

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
