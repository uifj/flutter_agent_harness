name: pudding
description: >-
  grpc,link,remote_config这些与具体业务集成的模块
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  sentry:
    path: ../infras/sentry
  # Pure-Dart MQTT v3.1/3.1.1 client (TCP + WebSocket, VM & web).
  # Wraps the ticket-auth flow (GetMqttTicket) in the first-party `mqtt/` module.
  mqtt_client: ^10.12.0
  # Uint8Buffer for MQTT publish payloads (mqtt_client's publishMessage arg).
  typed_data: ^1.3.2
  # gRPC client instrumentation (SentryGrpcInterceptor)
  grpc: '>=4.0.4 <6.0.0'
  meta: ^1.9.0
  # GraphQL / gql link instrumentation (SentryLink and friends)
  gql: '>=0.14.0 <2.0.0'
  gql_exec: '>=0.4.4 <2.0.0'
  gql_link: '>=0.5.0 <2.0.0'
  gql_error_link: '>=0.2.0 <2.0.0'
  # Firebase Remote Config feature-flag instrumentation
  firebase_remote_config: '>=5.4.3 <7.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  # ADR-0085 D4: aligned with flutter_lints 6 (lints ^6.0.0) for workspace resolution.
  lints: ^6.0.0
