name: board_panel
description: "A Flutter package for board/kanban panel UI."
version: 0.0.1
publish_to: 'none'

# ADR-0007 D5: consumed as a plain path dependency of the app (not a pub
# workspace member), and shadcn_ui resolves to the HOSTED 0.56.3 the app itself
# uses. The original `path: ../shadcn_ui` pointed at a directory that does not
# exist (the vendored mirror is `../flutter-shadcn-ui`), and pointing there
# instead would create a SECOND shadcn_ui package instance beside the hosted one
# — two ShadTheme types that never find each other.
environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

dependencies:
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  intl: ^0.20.2
  shadcn_ui: ^0.56.3


dev_dependencies:
  flutter_test:
    sdk: flutter

