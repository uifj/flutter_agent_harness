name: Desktop Build

env:
  FLUTTER_VERSION: '3.41.9'

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build Windows'
        required: false
        default: true
        type: boolean
      build_macos:
        description: 'Build macOS'
        required: false
        default: true
        type: boolean
      build_linux:
        description: 'Build Linux'
        required: false
        default: true
        type: boolean
      publish_release:
        description: 'Publish to GitHub Release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: ''
        type: string

jobs:
  windows:
    if: ${{ github.event.inputs.build_windows == 'true' }}
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/windows/x64/runner/release/

      - name: Zip for release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        run: |
          cd build/windows/x64/runner/release
          7z a ../../../../../agent-harness-windows-x64.zip .

      - name: Publish to Release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: agent-harness-windows-x64.zip

  macos:
    if: ${{ github.event.inputs.build_macos == 'true' }}
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Pod install
        run: cd macos && pod install

      - name: Build macOS
        run: flutter build macos --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos/Build/Products/Release/

      - name: Create DMG
        if: ${{ github.event.inputs.publish_release == 'true' }}
        run: |
          mkdir -p dmg_staging
          cp -R build/macos/Build/Products/Release/Agent\ Harness.app dmg_staging/
          hdiutil create -volname "Agent Harness" -srcfolder dmg_staging -ov -format UDZO agent-harness-macos.dmg

      - name: Publish to Release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: agent-harness-macos.dmg

  linux:
    if: ${{ github.event.inputs.build_linux == 'true' }}
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev pkg-config libsecret-1-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: build/linux/x64/release/bundle/

      - name: Tar for release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        run: |
          tar -czf agent-harness-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Publish to Release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: agent-harness-linux-x64.tar.gz
