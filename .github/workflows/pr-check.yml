name: PR Checks

env:
  FLUTTER_VERSION: '3.41.9'

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  checks:
    name: Analyze / Format / Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Dart format
        # ADR-0085 D5: first-party packages are gated alongside the app.
        run: >
          dart format --set-exit-if-changed
          lib test tool spike
          packages/appunits/app_common
          packages/appunits/plan_editor
          packages/infras/stone_core

      - name: Dart analyze
        run: >
          dart analyze --fatal-infos
          lib test tool spike
          packages/appunits/app_common
          packages/appunits/plan_editor
          packages/infras/stone_core

      - name: Flutter test
        run: flutter test

      - name: Flutter test (first-party packages)
        # app_common has no test/ directory yet (ADR-0085 finding 7: the test
        # floor is recorded in ADR-0083); only packages with tests are listed —
        # a path with no tests would fail the step and fake the gate.
        run: flutter test packages/appunits/plan_editor packages/infras/stone_core

  build-macos:
    # ADR-0085 D6: the Ubuntu job only proves analysis and tests compile the
    # Dart side; the macOS target itself (Swift pods, entitlements, app
    # assembly) builds nowhere automatically. Debug keeps the ~10 min budget.
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: CocoaPods install
        working-directory: macos
        run: pod install

      - name: Build macOS (debug)
        run: flutter build macos --debug
